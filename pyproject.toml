[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "second-brain"
version = "0.1.0"
description = "A local-first thinking tool with automatic connection discovery"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
think = "brain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*"]
